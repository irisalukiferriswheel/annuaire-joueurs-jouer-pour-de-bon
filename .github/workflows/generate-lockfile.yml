name: Generate frontend lockfile

on:
  push:
    branches: [agent/frontend-lockfile]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve dependency lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Replace latest tags with resolved semver ranges
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))

          for (const name of Object.keys(pkg.dependencies || {})) {
            const resolved = lock.packages?.[`node_modules/${name}`]?.version
            if (!resolved) throw new Error(`Could not resolve version for ${name}`)
            pkg.dependencies[name] = `^${resolved}`
          }

          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`)
          NODE
          npm install --package-lock-only --ignore-scripts
      - name: Commit reproducible dependency metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency metadata already up to date"
            exit 0
          fi
          git commit -m "Pin frontend dependency ranges"
          git push
